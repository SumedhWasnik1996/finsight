name: finsight
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Primary database
  sqflite: ^2.3.2
  sqflite_sqlcipher: ^2.2.1    # stay on 2.x — 3.x API may differ
  path: ^1.9.0

  # Encrypted backup
  encrypt: ^5.0.3
  pointycastle: ^3.9.1         # stay on 3.x — 4.x API may differ
  file_picker: ^8.0.3          # stay on 8.x — 10.x API may differ
  share_plus: ^12.0.1
  path_provider: ^2.1.5

  # Security
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1

  # Open Banking
  http: ^1.6.0
  url_launcher: ^6.3.2

  # State & navigation
  flutter_riverpod: ^2.5.1     # stay on 2.x — guide code uses 2.x patterns
  go_router: ^17.1.0

  # UI helpers
  fl_chart: ^1.1.1
  intl: ^0.19.0                # stay — tightly coupled to Flutter SDK
  shared_preferences: ^2.2.3
  uuid: ^4.5.3
  crypto: ^3.0.7
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
